name: CI Pipeline

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:
    branches:
      - main
      - 'feat/**'

jobs:
  secret-scan:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint-and-test:
    name: Lint & Offline Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.4"
          enable-cache: true

      - name: Install Dependencies
        run: uv sync --locked --extra dev

      - name: Run Ruff Linter
        run: uv run ruff check .

      - name: Run Offline Pytest Suite
        run: uv run pytest -v

  container-smoke:
    name: Container Build & Smoke Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Container Image
        run: docker build -t tron-ci:test .

      - name: Start Container
        run: |
          docker run -d \
            --name tron-smoke-test \
            -p 8080:8080 \
            -e PORT=8080 \
            -e GEMINI_API_KEY=test-key \
            -e GROQ_API_KEY=test-key \
            -e DATABASE_PATH=/app/data/tron.db \
            tron-ci:test

      - name: Verify Service Readiness & Health
        run: |
          echo "Waiting for service to be healthy..."
          STATUS=""
          for i in $(seq 1 30); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8080/healthz || true)
            if [ "$STATUS" = "200" ]; then
              echo "Healthcheck passed with HTTP 200 on attempt $i"
              curl -fsS http://127.0.0.1:8080/healthz
              break
            fi
            echo "Attempt $i: HTTP $STATUS - retrying in 1s..."
            sleep 1
          done
          if [ "$STATUS" != "200" ]; then
            echo "Smoke test failed! Container logs:"
            docker logs tron-smoke-test
            exit 1
          fi

      - name: Cleanup Smoke Container
        if: always()
        run: |
          docker stop tron-smoke-test || true
          docker rm tron-smoke-test || true
